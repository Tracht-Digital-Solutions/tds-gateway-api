# Serves the four pre-built static frontends (one server per port) for the
# optional `frontends` compose profile. Each root is a bind-mounted dist/.
# SPA-ish fallback to index.html keeps Astro's pretty-url routes working.

server {
    listen 8081;
    root /srv/landingpage;
    index index.html;
    location / { try_files $uri $uri/ $uri.html /index.html; }
}

server {
    listen 8082;
    root /srv/blog;
    index index.html;
    location / { try_files $uri $uri/ $uri.html /index.html; }
}

server {
    listen 8083;
    root /srv/admin;
    index index.html;
    location / { try_files $uri $uri/ $uri.html /index.html; }
}

server {
    listen 8084;
    root /srv/customer;
    index index.html;
    location / { try_files $uri $uri/ $uri.html /index.html; }
}
