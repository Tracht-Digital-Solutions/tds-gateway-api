; Supervisor program group for the in-container TDS stack.
;
; The gateway listens on 0.0.0.0:8000 (the only published port); the backends
; stay on the loopback at the ports the gateway proxies to. Logs are redirected
; to the container's stdout/stderr so `docker logs` shows them.
;
; Ports MUST match the gateway's *_UPSTREAM defaults (see .env.example).
;
; ONE INSTANCE BY DEFAULT. `GATEWAY_MODE=inprocess` (the default, in the app and
; in the entrypoint) means the gateway loads each service's Slim app inside its
; OWN process — the loopback servers below are never dialled. Starting them
; anyway burned three PHP processes per container and, worse, misled debugging:
; the ports answered, so they looked like the live request path while all real
; traffic went through the gateway's in-process dispatcher. They are therefore
; gated on TDS_BACKEND_AUTOSTART, which the entrypoint derives from
; GATEWAY_MODE — only `proxy` starts them. This mirrors the production host,
; where there is one PHP-FPM app and no service processes at all.

[program:gateway]
command=php -S 0.0.0.0:%(ENV_TDS_GATEWAY_PORT)s -t /srv/tds/gateway/public /srv/tds/gateway/public/router.php
directory=/srv/tds/gateway
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:auth]
command=php -S 127.0.0.1:8003 -t /srv/tds/services/auth/public /srv/tds/services/auth/public/router.php
directory=/srv/tds/services/auth
autostart=%(ENV_TDS_BACKEND_AUTOSTART)s
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:customer]
command=php -S 127.0.0.1:8004 -t /srv/tds/services/customer/public /srv/tds/services/customer/public/router.php
directory=/srv/tds/services/customer
autostart=%(ENV_TDS_BACKEND_AUTOSTART)s
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=php -S 127.0.0.1:8100 -t /srv/tds/services/frontend/public /srv/tds/services/frontend/public/router.php
directory=/srv/tds/services/frontend
autostart=%(ENV_TDS_BACKEND_AUTOSTART)s
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
