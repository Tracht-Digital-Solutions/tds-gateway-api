; Supervisor program group for the in-container TDS stack.
;
; The gateway listens on 0.0.0.0:8000 (the only published port); the four
; services stay on the loopback at the ports the gateway proxies to. Logs are
; redirected to the container's stdout/stderr so `docker logs` shows them.
;
; Ports MUST match the gateway's *_UPSTREAM defaults (see .env.example).

[program:gateway]
command=php -S 0.0.0.0:8000 -t /srv/tds/gateway/public
directory=/srv/tds/gateway
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:auth]
command=php -S 127.0.0.1:8003 -t /srv/tds/services/auth/public
directory=/srv/tds/services/auth
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:contact]
command=php -S 127.0.0.1:8002 -t /srv/tds/services/contact/public
directory=/srv/tds/services/contact
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:content]
command=php -S 127.0.0.1:8001 -t /srv/tds/services/content/public
directory=/srv/tds/services/content
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:customer]
command=php -S 127.0.0.1:8004 -t /srv/tds/services/customer/public
directory=/srv/tds/services/customer
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
