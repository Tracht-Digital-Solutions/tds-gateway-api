name: CI

# PR-only gate (the push/dispatch builds run via dev.yml → _assemble.yml).
# The lint/test body lives in _check.yml, shared with _assemble.yml.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/_check.yml
    secrets: inherit
