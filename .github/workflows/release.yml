name: Release assemble → release branch (manual)

# Production bundle, ONLY on the manual Actions button. Assembles into the
# `release` branch and pings the deploy webhook (host pulls `release`).
on:
  workflow_dispatch:

concurrency:
  group: release-assemble
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/_assemble.yml
    with:
      channel: release
      deploy: true
    secrets: inherit
