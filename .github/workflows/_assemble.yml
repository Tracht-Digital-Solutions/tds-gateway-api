name: Assemble (reusable)

# Reusable: check the gateway, assemble gateway + the current backends into a
# self-contained bundle, force-publish it to the `channel` branch, and
# optionally ping the deploy webhook. Called by dev.yml (channel=dev, no
# deploy) and release.yml (channel=release, deploy=true). Same-repo
# workflow_call — no cross-repo org restriction.
#
# Services bundled (post frontend-platform cutover):
#   auth      -> tds-auth-api            (/auth,  prefix-stripped)
#   customer  -> tds-customer-api        (/customer, prefix-stripped)
#   frontend  -> tds-core-frontend-api   (DEFAULT catch-all; composes the
#                extension Modules in-process — replaces the archived
#                content/contact backends)
#
# `frontend` composes its extensions via Composer `path` repos pointing at
# sibling checkouts (../tds-ext-* + ../tds-frontend-contract-pkg); we check
# those out next to it and force Composer to COPY (not symlink) the path repos
# into vendor/ (COMPOSER_MIRROR_PATH_REPOS=1) so the bundle stays self-contained.

on:
  workflow_call:
    inputs:
      channel:
        description: Target branch (dev | release)
        required: true
        type: string
      deploy:
        description: Ping the deploy webhook after publishing
        required: false
        default: false
        type: boolean

jobs:
  check:
    uses: ./.github/workflows/_check.yml
    secrets: inherit

  assemble:
    name: Assemble gateway + services
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout gateway
        uses: actions/checkout@v5
        with:
          path: _src/gateway

      - name: Checkout tds-auth-api
        uses: actions/checkout@v5
        with:
          repository: Tracht-Digital-Solutions/tds-auth-api
          ref: main
          token: ${{ secrets.ASSEMBLE_TOKEN }}
          path: _src/auth

      - name: Checkout tds-customer-api
        uses: actions/checkout@v5
        with:
          repository: Tracht-Digital-Solutions/tds-customer-api
          ref: main
          token: ${{ secrets.ASSEMBLE_TOKEN }}
          path: _src/customer

      - name: Checkout tds-core-frontend-api
        uses: actions/checkout@v5
        with:
          repository: Tracht-Digital-Solutions/tds-core-frontend-api
          ref: main
          token: ${{ secrets.ASSEMBLE_TOKEN }}
          path: _src/frontend

      # frontend's Composer `path` repos resolve to these siblings of _src/frontend
      # (../tds-frontend-contract-pkg + ../tds-ext-*). Keep the directory names
      # EXACTLY as referenced in tds-core-frontend-api/composer.json.
      - name: Checkout tds-frontend-contract-pkg
        uses: actions/checkout@v5
        with:
          repository: Tracht-Digital-Solutions/tds-frontend-contract-pkg
          ref: main
          token: ${{ secrets.ASSEMBLE_TOKEN }}
          path: _src/tds-frontend-contract-pkg

      - name: Checkout enabled extensions
        uses: actions/checkout@v5
        with: { repository: Tracht-Digital-Solutions/tds-ext-time-tracker-pkg, ref: main, token: '${{ secrets.ASSEMBLE_TOKEN }}', path: _src/tds-ext-time-tracker-pkg }
      - uses: actions/checkout@v5
        with: { repository: Tracht-Digital-Solutions/tds-ext-customers-pkg, ref: main, token: '${{ secrets.ASSEMBLE_TOKEN }}', path: _src/tds-ext-customers-pkg }
      - uses: actions/checkout@v5
        with: { repository: Tracht-Digital-Solutions/tds-ext-billing-pkg, ref: main, token: '${{ secrets.ASSEMBLE_TOKEN }}', path: _src/tds-ext-billing-pkg }
      - uses: actions/checkout@v5
        with: { repository: Tracht-Digital-Solutions/tds-ext-lexware-pkg, ref: main, token: '${{ secrets.ASSEMBLE_TOKEN }}', path: _src/tds-ext-lexware-pkg }
      - uses: actions/checkout@v5
        with: { repository: Tracht-Digital-Solutions/tds-ext-tools-pkg, ref: main, token: '${{ secrets.ASSEMBLE_TOKEN }}', path: _src/tds-ext-tools-pkg }
      - uses: actions/checkout@v5
        with: { repository: Tracht-Digital-Solutions/tds-ext-messages-pkg, ref: main, token: '${{ secrets.ASSEMBLE_TOKEN }}', path: _src/tds-ext-messages-pkg }
      - uses: actions/checkout@v5
        with: { repository: Tracht-Digital-Solutions/tds-ext-projects-pkg, ref: main, token: '${{ secrets.ASSEMBLE_TOKEN }}', path: _src/tds-ext-projects-pkg }
      - uses: actions/checkout@v5
        with: { repository: Tracht-Digital-Solutions/tds-ext-documents-pkg, ref: main, token: '${{ secrets.ASSEMBLE_TOKEN }}', path: _src/tds-ext-documents-pkg }

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, pdo_mysql, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-assemble-${{ hashFiles('_src/*/composer.json') }}
          restore-keys: composer-assemble-

      - name: Install dependencies (production only)
        run: |
          for dir in gateway auth customer; do
            echo "::group::composer install $dir"
            composer install \
              --working-dir "_src/$dir" \
              --no-dev --no-interaction --prefer-dist --no-progress \
              --optimize-autoloader
            echo "::endgroup::"
          done

      # frontend (tds-core-frontend-api) composes its extensions through Composer
      # `path` repos to the sibling checkouts above. `composer update` re-resolves
      # them fresh from `main` (the committed lock may lag those tips), and
      # COMPOSER_MIRROR_PATH_REPOS=1 COPIES the path packages into vendor/ instead
      # of symlinking — otherwise the bundle would ship dangling symlinks into
      # _src/. It already carries phinx in `require` (its in-process auto-migrator
      # runs the extensions' migrations), so no phinx re-add is needed here.
      - name: Install frontend (compose extensions, mirror path repos)
        env:
          COMPOSER_MIRROR_PATH_REPOS: '1'
        run: |
          echo "::group::composer update frontend"
          composer update \
            --working-dir "_src/frontend" \
            --no-dev --no-interaction --prefer-dist --no-progress \
            --optimize-autoloader
          echo "::endgroup::"

      # auth + customer keep phinx in require-dev, but the host needs it to run
      # `vendor/bin/phinx migrate -e production` from the bundle (the whole point
      # of the single-project deploy is that the host never runs a full composer
      # install). Re-add it post --no-dev with the exact constraint each repo pins,
      # so the bundle ships the migration runner without dragging phpunit & friends.
      - name: Add phinx for host-side migrations
        run: |
          for dir in auth customer; do
            constraint=$(jq -r '."require-dev"."robmorgan/phinx" // empty' "_src/$dir/composer.json")
            if [ -z "$constraint" ]; then
              echo "::warning title=phinx missing::_src/$dir has no robmorgan/phinx in require-dev - bundle ships without a migration runner for $dir."
              continue
            fi
            echo "::group::composer require phinx $dir ($constraint)"
            composer require "robmorgan/phinx:$constraint" \
              --working-dir "_src/$dir" \
              --no-interaction --no-progress --update-no-dev --optimize-autoloader
            echo "::endgroup::"
          done

      - name: Assemble bundle
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist/services

          # Gateway at the root of the bundle.
          #
          # '.gitignore' MUST be excluded: the publish step git-adds dist/
          # into the build branch, and a copied service .gitignore (all of
          # them list /vendor/) would silently drop the vendor directories
          # from the commit — shipping a bundle that claims to be
          # self-contained but isn't (gateway#3).
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.gitignore' \
            --exclude 'tests' \
            --exclude 'phpunit.xml' --exclude '.phpunit.cache' \
            _src/gateway/ dist/gateway/

          # Each micro-backend under services/<name> (keep vendor/, keep
          # auth's committed keys/public.pem; private keys are never in git).
          # NB: the per-service vendor/ is what the gateway's default in-process
          # mode (GATEWAY_MODE=inprocess) requires — it requires
          # services/<name>/vendor/autoload.php at runtime. The Procfile/
          # services.json below describe the optional proxy-mode loopback ports.
          for name in auth customer frontend; do
            rsync -a \
              --exclude '.git' --exclude '.github' --exclude '.gitignore' \
              --exclude 'tests' \
              --exclude 'phpunit.xml' --exclude '.phpunit.cache' \
              "_src/$name/" "dist/services/$name/"
          done

          # Process manifest (ports must match the gateway's *_UPSTREAM).
          cat > dist/Procfile <<'EOF'
          gateway: php -S 0.0.0.0:8000 -t gateway/public
          auth: php -S 127.0.0.1:8003 -t services/auth/public
          customer: php -S 127.0.0.1:8004 -t services/customer/public
          frontend: php -S 127.0.0.1:8100 -t services/frontend/public
          EOF

          cat > dist/services.json <<'EOF'
          {
            "gateway": { "path": "gateway", "port": 8000 },
            "services": {
              "auth":     { "path": "services/auth",     "port": 8003, "public_prefix": "/auth" },
              "customer": { "path": "services/customer", "port": 8004, "public_prefix": "/customer" },
              "frontend": { "path": "services/frontend", "port": 8100, "public_prefix": "/", "default": true }
            }
          }
          EOF

          # Provenance: which source commit each piece was built from.
          sha() { git -C "$1" rev-parse HEAD; }
          cat > dist/BUILD_INFO.json <<EOF
          {
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "trigger": "${{ github.event_name }}",
            "sources": {
              "gateway":  "$(sha _src/gateway)",
              "auth":     "$(sha _src/auth)",
              "customer": "$(sha _src/customer)",
              "frontend": "$(sha _src/frontend)"
            },
            "frontend_extensions": {
              "contract":     "$(sha _src/tds-frontend-contract-pkg)",
              "time-tracker": "$(sha _src/tds-ext-time-tracker-pkg)",
              "customers":    "$(sha _src/tds-ext-customers-pkg)",
              "billing":      "$(sha _src/tds-ext-billing-pkg)",
              "lexware":      "$(sha _src/tds-ext-lexware-pkg)",
              "tools":        "$(sha _src/tds-ext-tools-pkg)",
              "messages":     "$(sha _src/tds-ext-messages-pkg)",
              "projects":     "$(sha _src/tds-ext-projects-pkg)",
              "documents":    "$(sha _src/tds-ext-documents-pkg)"
            }
          }
          EOF

          cat > dist/README.md <<'EOF'
          # tds-api-gateway — assembled bundle (generated)

          Do not edit. This branch is force-pushed by CI on every gateway or
          API push. It contains the PHP gateway plus the current backends
          (`auth`, `customer`, and the composed `frontend` = tds-core-frontend-api
          with its extensions) with their `vendor/` directories, ready to run.

          Default run mode: point a PHP-FPM docroot at `gateway/public` — the
          gateway serves every service in-process (`GATEWAY_MODE=inprocess`),
          nothing else to start. `frontend` is the default (catch-all) upstream:
          `/auth/*` and `/customer/*` route to those backends, everything else to
          the composed frontend API. The `Procfile` / `deploy/supervisor.conf.example`
          are for the optional `GATEWAY_MODE=proxy` (loopback `php -S`). Each
          service still needs its own `.env` on the host. The internal API wiki
          is served by the frontend API (`/wiki.json`), not the gateway. See
          `BUILD_INFO.json` for the source commit of each piece.
          EOF

      - name: Publish to ${{ inputs.channel }} branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Despite the field name, this is the org PAT (repo scope) — it must
          # check out the private API repos AND push the artifact branch, which
          # the default GITHUB_TOKEN can't do across repos.
          github_token: ${{ secrets.ASSEMBLE_TOKEN }}
          publish_branch: ${{ inputs.channel }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "${{ inputs.channel }}: assemble gateway + services"

      - name: Trigger deploy webhook
        if: ${{ inputs.deploy }}
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL not set - skipping deploy ping."
            exit 0
          fi
          echo "Pinging deploy webhook..."
          # The bundle is already published to the build branch by the time we
          # get here, so a failed deploy ping must NOT red the build (a wrong
          # URL or a host hiccup shouldn't mask a good assembly). Capture the
          # status, never exit non-zero, and surface a failure as a loud
          # Actions warning instead. "000" = curl couldn't even connect.
          # Plesk's git web-hook only answers POST (a bare GET 404s); -L follows
          # any panel redirect and re-POSTs. A failed ping still must not red the build.
          echo "POSTing deploy webhook to $(printf '%s' "$DEPLOY_WEBHOOK_URL" | cut -d/ -f1-3) ..."
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -L --post301 --post302 --post303 \
            --retry 3 --retry-delay 5 --max-time 30 \
            "$DEPLOY_WEBHOOK_URL" || echo "000")
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Deploy webhook pinged (HTTP $code)."
          else
            echo "::warning title=Deploy webhook failed::Webhook returned HTTP $code. The build branch is published but the production host was not notified - check the DEPLOY_WEBHOOK_URL secret."
          fi
